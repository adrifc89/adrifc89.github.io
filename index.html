<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>adrifc89 · Apps</title>
<style>
  :root { --bg: #F5F0E6; --surface: #FFFDF8; --text: #2E3A32; --muted: #6F786F; --primary: #476A58; --line: #DED6C9; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 16px;
    background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; }
  .eyebrow { color: var(--primary); font-size: 11px; font-weight: 800; letter-spacing: 1.6px; margin: 0; }
  h1 { font-size: 28px; margin: 6px 0 6px; }
  p.lede { color: var(--muted); margin: 0 0 28px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin-bottom: 12px; }
  .card { padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .name { font-weight: 800; font-size: 17px; }
  .what { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .links { margin-top: 10px; font-size: 14px; }
  .links a { color: var(--primary); margin-right: 16px; }
  footer { color: var(--muted); font-size: 13px; margin-top: 36px; }
  footer a { color: var(--primary); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">ADRIFC89</p>
  <h1>Apps</h1>
  <p class="lede">Juegos y aplicaciones que publico. <span lang="en">Games and apps I publish.</span></p>

  <ul>
    <li class="card">
      <div class="name">Detective Murdoku</div>
      <div class="what">Un juego de deducción: un sospechoso por fila y columna. <span lang="en">A deduction puzzle game.</span></div>
      <div class="links">
        <a href="https://play.google.com/store/apps/details?id=com.dinotoff.murdoku">Google Play</a>
        <a href="/murdoku/">Ayuda · <span lang="en">Help</span></a>
        <a href="/legal/murdoku/">Privacidad · <span lang="en">Privacy</span></a>
      </div>
    </li>
  </ul>

  <footer><a href="/legal/">Textos legales</a> · <span lang="en">Legal</span></footer>
</main>
</body>
</html>
